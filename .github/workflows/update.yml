# 30분마다 scripts/update.sh(수집, 예보·성적표, 22~24시 내일 예보 고정, 커밋, gh-pages 배포)를 돌린다.
# 2026-11-14 현재 계정 결제 잠금으로 Actions가 시작되지 않아 맥미니 예약 작업이 같은 스크립트를 대신 돌린다(OPERATIONS.md).
name: update

on:
  schedule:
    - cron: "7,37 * * * *" # 정각은 GitHub 쪽 부하로 늦어지기 쉬워 7분, 37분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 시험
        run: python3 -m unittest
      - name: 갱신과 배포
        env:
          KSPO_PARKING_API_KEY: ${{ secrets.KSPO_PARKING_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KCISA_KEY_675: ${{ secrets.KCISA_KEY_675 }}
        run: |
          git config user.name "allpark-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/update.sh
