# 30분마다 실측을 기록하고, 예보·성적표를 다시 만들고, 22~24시(한국)에는 내일 예보를 고정한 뒤 GitHub Pages로 배포한다.
name: update

on:
  schedule:
    - cron: "7,37 * * * *" # 정각은 GitHub 쪽 부하로 늦어지기 쉬워 7분, 37분에 돈다
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      KSPO_PARKING_API_KEY: ${{ secrets.KSPO_PARKING_API_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      KCISA_KEY_675: ${{ secrets.KCISA_KEY_675 }}
    steps:
      - uses: actions/checkout@v4
      - name: 시험
        run: python3 -m unittest
      - name: 실시간 주차대수 기록
        if: github.event_name != 'push'
        continue-on-error: true # 실패해도 예보와 화면은 만든다. 화면에 마지막 수집 시각이 드러난다
        run: python3 pipeline/run.py collect
      - name: 예보·성적표 만들기
        run: python3 pipeline/run.py build
      - name: 내일 예보 고정(22~24시만)
        run: python3 pipeline/run.py freeze
      - name: 커밋
        run: |
          git config user.name "allpark-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신"
          git pull -q --rebase && git push -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
